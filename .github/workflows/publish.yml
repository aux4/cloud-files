name: Publish Package

# Production publication is a reviewed-main operation.  The manual trigger is
# intentionally retained for release-level selection, but the job guard below
# makes a dispatch from any other ref a no-op.
on:
  workflow_dispatch:
    inputs:
      level:
        description: Release level
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-package
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v6
      - name: Run Files regression suite
        run: node --test test/*.test.mjs
      - name: Run package tests without publishing
        uses: aux4/action@d20926069ceafd632f4f2c6d1ff952005cc91486 # v1
        with:
          command: test
      - name: Require approved metered Cloud Files plans
        run: node scripts/validate-production-release.mjs
      - name: Validate public package metadata and plans
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const metadata = JSON.parse(fs.readFileSync('package/.aux4', 'utf8'));
          const plans = JSON.parse(fs.readFileSync('package/plans.json', 'utf8'));
          if (metadata.scope !== 'aux4' || metadata.name !== 'cloud-files' || metadata.type !== 'cloud' || metadata.repository !== 'public' || metadata.private !== false) {
            throw new Error(`unexpected public cloud package manifest: ${metadata.scope}/${metadata.name}, type=${metadata.type}, repository=${metadata.repository}, private=${metadata.private}`);
          }
          if (!/^\d+\.\d+\.\d+$/.test(metadata.version)) {
            throw new Error(`invalid package version: ${metadata.version}`);
          }
          const names = Object.keys(plans.plans || {});
          if (names.length === 0) throw new Error('at least one production plan is required');
          if (plans.schemaVersion !== 1 || !plans.metrics || typeof plans.metrics !== 'object' || Object.keys(plans.metrics).length !== 1) {
            throw new Error('plans.json must contain schemaVersion 1 and one metric');
          }
          const metric = plans.metrics['storage-bytes'];
          const unit = metric && metric.unit;
          if (metric.type !== 'gauge' || unit.base !== 'byte' || unit.display !== 'GB' || unit.baseUnitsPerDisplayUnit !== 1000000000 || !Number.isSafeInteger(unit.decimals) || unit.decimals < 0) {
            throw new Error('storage-bytes must declare a normalized safe byte/GB unit');
          }
          for (const [name, plan] of Object.entries(plans.plans)) {
            const price = plan.price;
            if (!price || Object.hasOwn(price, 'monthly')) throw new Error(`plan ${name} must use GB-month metering, not fixed monthly pricing`);
            const meter = price.metered;
            if (!meter || Object.keys(meter).sort().join(',') !== 'includedBytes,microCentsPerUnit,unit' || meter.unit !== 'gb-month' || !Number.isSafeInteger(meter.microCentsPerUnit) || meter.microCentsPerUnit <= 0 || !Number.isSafeInteger(meter.includedBytes) || meter.includedBytes < 0) {
              throw new Error(`plan ${name} must contain the approved GB-month metered descriptor; production rate is not set`);
            }
          }
          const remote = execFileSync('git', ['config', '--get', 'remote.origin.url'], {encoding: 'utf8'}).trim();
          const publicRemotes = new Set(['https://github.com/aux4/cloud-files', 'git@github.com:aux4/cloud-files']);
          if (!publicRemotes.has(remote.replace(/\.git$/, ''))) {
            throw new Error(`repository is not the public aux4/cloud-files repo: ${remote}`);
          }
          console.log(`preflight ok: ${metadata.scope}/${metadata.name}@${metadata.version}; plans=${names.join(',')}; remote=${remote}`);
          NODE

  publish:
    permissions:
      contents: write
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Mint public aux4 publisher token
        id: mint
        env:
          CLIENT_ID: ${{ secrets.AUX4_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_PUBLISHER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo '::error::AUX4_PUBLISHER_CLIENT_ID/SECRET are required for public aux4 publication'
            exit 1
          fi
          TOKEN=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" \
            -d grant_type=client_credentials \
            'https://sso.aux4.io/token' | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo '::error::publisher client_credentials mint returned no access_token'
            exit 1
          fi
          printf '::add-mask::%s\n' "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - uses: aux4/action@fe4f96b6f0dbdb08906baadb07c7602cd4c62e2b
        with:
          command: publish
          strict_lineage: 'true'
          expected_source_sha: ${{ github.sha }}
          level: ${{ inputs.level }}
          aux4_token: ${{ steps.mint.outputs.token }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
